# The comctl32 v6 test-manifest runner is NOT registered here on purpose.
#
# Cargo's `runner` key applies to `cargo run` as well as `cargo test`. Setting
# it globally makes `tauri dev` launch the app through powershell.exe, which
# opens an empty console window beside the app. The runner lives in
# .cargo\test-runner.toml instead and is passed only when testing:
#
#   cargo test --config .cargo\test-runner.toml
#
# Without it, `cargo test` dies at load with STATUS_ENTRYPOINT_NOT_FOUND before
# any test runs. See docs/comctl32-test-runner.md for the full explanation.
