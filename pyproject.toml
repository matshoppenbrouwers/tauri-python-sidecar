[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tauri-python-sidecar"
version = "0.1.1"
description = "Supervised Python sidecar for a Tauri desktop app: authenticated TCP JSON-RPC, cross-process SQLite migrations, crash recovery."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Replace with your own name and email before publishing.
authors = [{ name = "matshoppenbrouwers" }]

# Deliberately tiny. The template's own runtime needs nothing but the standard
# library plus `filelock` for the cross-process migration lock. Every dependency
# you add here also has to survive Nuitka compilation (see packaging/).
dependencies = ["filelock>=3.12"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/matshoppenbrouwers/tauri-python-sidecar"
Repository = "https://github.com/matshoppenbrouwers/tauri-python-sidecar"

[tool.setuptools.packages.find]
include = ["sidecar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
